[package]
name = "other-model"
version = "0.1.1"
description = "Local multi-provider OpenAI-compatible model gateway desktop app"
authors = ["Other Model"]
edition = "2021"
license = "MIT"

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
]

[lib]
name = "other_model_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "other-model"
path = "src/main.rs"

[[bin]]
name = "other-model-web"
path = "src/web_main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
axum = { version = "0.7.9", features = ["macros"] }
bytes = "1.11.0"
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
futures-util = "0.3.31"
http = "1.3.1"
http-body-util = "0.1.3"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls", "cookies"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.9.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.1", optional = true }
tauri-plugin-opener = { version = "2.5.0", optional = true }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "net", "fs", "time", "signal"] }
tokio-util = { version = "0.7.17", features = ["io"] }
toml = "0.9.8"
toml_edit = { version = "0.23.7", features = ["serde"] }
tower-http = { version = "0.6.7", features = ["cors", "trace", "fs"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23.0"
wiremock = "0.6.5"
