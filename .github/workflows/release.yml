name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact-name: other-model-macos-arm64
          - platform: macos-13
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact-name: other-model-macos-intel
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: ''
            artifact-name: other-model-windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Other Model ${{ github.ref_name }}
          releaseBody: |
            Other Model desktop gateway release.

            Assets include macOS Apple Silicon, macOS Intel, and Windows x64 builds.
          releaseDraft: true
          prerelease: false

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/**/bundle/**/*
